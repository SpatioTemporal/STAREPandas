[versioneer]
VCS = git
style = pep440
versionfile_source = starepandas/_version.py
versionfile_build = starepandas/_version.py
tag_prefix = v
parentdir_prefix = starepandas


[metadata]
name = starepandas
description = STARE pandas extensions
author = Niklas Griessbaum
author_email = griessbaum@ucsb.edu
url = https://github.com/SpatioTemporal/STAREPandas
long_description = file: README.md
long_description_content_type = text/markdown
project_urls =
    Bug Tracker = https://github.com/SpatioTemporal/STAREPandas/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
license = MIT


[options]
python_requires = >=3.12
packages = find:
install_requires =
    numpy>=2.2.1
    geopandas>=0.14.0
    shapely>=2.0
    pandas>=2.0.3
    # Dask stack: keep these EXACTLY the same version
    dask==2025.7.0
    distributed==2025.7.0
    fsspec==2025.7.0
    s3fs==2025.7.0
    # ---- AWS bits ----
    # If you DO NOT directly import boto3, remove it entirely to avoid conflicts
    # boto3>=1.23.10   <-- remove this line
    # Optionally *enforce* a matching boto3 via aiobotocore extras:
    aiobotocore[boto3]>=2.24,<2.25
    # -------------------
    cartopy>=0.22.0
    pystare>=0.8.14
    h5py>=3.7.0
    pyarrow>=19.0.0
    pyhdf>=0.10.5
    netCDF4>=1.5.8
    astropy>=7.0.0
    matplotlib>=3.5.2
    rasterio>=1.4.1
    # Old xarray + new dask is risky; bump xarray to a modern release
    xarray>=2025.8.0
    rtree>=1.0.0
    scipy>=1.9.1
    puremagic>=1.14
    sqlalchemy>=2.0.18
    GeoAlchemy2>=0.14.0
    psycopg2>=2.9.6
    zarr>=2.15.0


# peg sqlalchemy version until pandas fixes https://github.com/pandas-dev/pandas/issues/51015

include_package_data = True

[options.packages.find]
exclude = 
    figures
    tests
    examples
    docs

[options.package_data]
starepandas = .config
starepandas.datasets =  '*.hdf', '*.nc'
